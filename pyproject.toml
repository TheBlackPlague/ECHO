[project]
name = "ECHO"
version = "0.2.0"
description = "Emergency Copy Held Offsite - Self-hosted archival for the data you cannot afford to lose"
authors = [
    { name = "Shaheryar Sohail", email = "me@shaheryarsohail.com" },
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rich>=15.0.0,<16.0.0",
    "structlog>=26.1.0,<27.0.0",
    "uvicorn>=0.52.3,<0.53.0",
]

[project.scripts]
echo = "echo.server:run"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "echo", from = "src" }]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
filterwarnings = [
    "error::ResourceWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["echo"]

[tool.coverage.report]
fail_under = 100
partial_branches = [
    '^\s*if .*:\s+(?:raise|return)\b',
]
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",
    "B",
    "ASYNC",
    "RUF",
]

ignore = [
    "ASYNC109",
    "ASYNC240",
]
